name: Vérification eGame Bénin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vérifier la compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activer pnpm
        run: corepack enable
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Vérifier TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - name: Compiler Vite
        run: pnpm build
